# Static site: no build step. The home page serves Captain Bear 2;
# the earlier games stay reachable at their own paths.
[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/captain-bear-2.html"
  status = 200
  force = true

[[redirects]]
  from = "/captain-bear"
  to = "/bear.html"
  status = 200

[[redirects]]
  from = "/commander-cap"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
